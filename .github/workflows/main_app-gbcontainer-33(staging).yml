# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-33

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crlsh33.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_7FC125D5916C4E9CA539B506CFF363DF }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D278BCDC60EA4E92A1CEB88715FC0875 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crlsh33.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_7FC125D5916C4E9CA539B506CFF363DF }}/guestbook:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-33'
          slot-name: 'staging'
          images: 'crlsh33.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_7FC125D5916C4E9CA539B506CFF363DF }}/guestbook:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_707F2B80E369441EBA7C4B063FB2D63A }}